name: CKO Controlled Assurance Gate

on:
  pull_request:
  push:
    paths:
      - "cko-controlled/**"
      - "reference-website/**"
      - "firebase.json"
      - ".github/workflows/cko-controlled-gate.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cascade policy-as-code → schemas → graph → CI → runtime → evidence
        run: |
          cd cko-controlled
          python3 scripts/generate_universe.py
          python3 scripts/sync_tool_runtime.py
          python3 scripts/generate_pendencies.py
          node --test tests/suite.test.js
          node cli.mjs
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          r=json.load(open("public/data/gate-report.json"))
          assert r["starts_at"]=="policy-as-code"
          ids=[s["id"] for s in r["cascade"]]
          assert ids==["policy-as-code","schemas","graph-constraints","CI-gates","runtime-assertions","automatic-evidence"]
          assert all(s["status"]=="PASS" for s in r["cascade"])
          pol=json.load(open("public/policies/fail-closed.json"))
          assert pol["root"] is True
          assert pol["kind"]=="policy-as-code"
          assert pol["cascade"]==ids
          site=Path("../reference-website")
          idx=(site/"index.html").read_text(encoding="utf-8")
          assert "PAGE_INSTITUTIONAL_CLUSTER" in idx
          assert 'id="graph"' not in idx
          firebase=json.load(open("../firebase.json"))
          assert firebase["hosting"]["public"]=="reference-website"
          ignore=set(firebase["hosting"]["ignore"])
          assert "cko-relatorio-tecnico-final.html" in ignore
          assert "grafo-clinico.html" in ignore
          inv=json.load(open("public/data/tool-library-runtime.json"))
          for p in ["aldrete.html","imc.html","gotejamento.html","biblioteca.html"]:
              assert p in inv["tool_canaries"] or p in inv["library_canaries"]
          assert inv["structure"]=="calenf"
          gov=json.load(open(site/"data/cko/governance.json"))
          assert gov["nursePalm"]["operational"]=="NOT_ASSERTED"
          assert gov["digitalTwin"]["observed"] is False
          assert (site/"aldrete.html").read_text(encoding="utf-8").find("btnCalcular")>=0
          assert (site/"js/calc-engine.js").read_text(encoding="utf-8").find("calc-engine")>=0
          assert (site/"js/nurse-palm.js").is_file()
          assert (site/"js/knowledge-graph.js").is_file()
          assert (site/"data/schemas/tool.schema.json").is_file()
          p=json.load(open("public/data/pendencies.json"))
          assert p["mutate_drive"] is False
          assert p["closes_b9"] is False
          assert p["items"]
          assert sum(1 for i in p["items"] if i["kind"]=="locale-cell")==360
          freeze=json.load(open("public/data/drive-immutable.json"))
          for f in freeze["files"]:
              raw=Path(f["path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==f["sha256"], f["path"]
          assert (site/"sitemap.xml").is_file()
          assert (site/"berg.html").is_file()
          print("cascade root policy-as-code OK; CALENF site; pendencies explicit; Drive immutable")
          PY
      - name: Fail-closed release invariant
        run: |
          python3 - <<'PY'
          import json
          u=json.load(open("cko-controlled/public/data/universe.json"))
          assert u["baseline"]["release"].find("NOT_RELEASED")>=0
          assert u["document"]["not_production_release"] is True
          print("release remains HOLD / NOT_RELEASED")
          PY
