.then((data) => {
document.getElementById("footer-placeholder").innerHTML = data;
if (typeof carregarTraducoes === "function") {
carregarTraducoes("pt", "footer.json");
carregarTraducoes("pt", "cookies.json");
}
});

// Variável global compartilhada entre filtros e lightbox
var bibliotecaGlobal = [];

// Nova Lógica de Filtros (Estilo Google) + Pesquisa Global
(function(){
var dynamicGrid = document.getElementById('grid-dinamico');
var staticGrids = ['grid-todos','grid-documentos','grid-fotos','grid-videos'].map(function(id){return document.getElementById(id);}).filter(Boolean);
var searchInput = document.getElementById('search-input');
var searchClear = document.getElementById('search-clear');
var currentFilter = 'todos';

// Carregar JSON global
fetch('/biblioteca.json')
.then(function(r){return r.json();})
.then(function(data){
bibliotecaGlobal = data;
})
.catch(function(e){console.error('Erro ao carregar biblioteca:',e);});

// Função de similaridade (contém todas as palavras da query?)
function matchesSearch(item, query){
var q = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
var words = q.split(/\s+/).filter(function(w){return w.length>0;});
if(words.length===0) return true;
var target = ((item.titulo||'') + ' ' + (item.descricao||'') + ' ' + (item.slug||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
return words.every(function(w){return target.indexOf(w)!==-1;});
}

function getCategoria(item){
var cat = String(item.categoria||'').toLowerCase().trim();
if(cat.includes('doc')||cat.includes('pdf')) return 'documentos';
if(cat.includes('video')||cat.includes('vídeo')||cat==='mp4') return 'videos';
return 'fotos'; // default para fotos/imagens
}

// Renderizar cards no grid dinâmico
function renderDynamicCards(items){
if(!dynamicGrid) return;
if(items.length===0){
dynamicGrid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="text-4xl mb-3 mx-auto opacity-30" fill="currentColor" width="1em" height="1em"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg><p class="font-bold">Nenhum item encontrado</p><p class="text-sm">Tente outro termo de pesquisa.</p></div>';
return;
}
var html = '';
items.forEach(function(item, idx){
html += gerarCardGoogleImagesJS(item, idx);
});
dynamicGrid.innerHTML = html;
}

// Versão JS da função de card (igual à do build, com otimizações LCP/CLS)
function gerarCardGoogleImagesJS(item, index){
var titulo = item.titulo || 'Sem título';
var slug = item.slug || slugifyJs(titulo);
var imagePath = item.capa || item.ficheiro || '';
if(imagePath && !imagePath.startsWith('/')) imagePath = '/' + imagePath;
var ext = ((item.ficheiro||'').split('.').pop()||'').toLowerCase();
if(!ext && (item.categoria==='fotos'||item.categoria==='imagens')) ext='png';
if(!ext && (item.categoria==='documentos'||item.categoria==='pdf')) ext='pdf';

var badgeBg='#f3f4f6',badgeText='#374151',badgeIcon='fa-file',badgeLabel=ext.toUpperCase()||'ARQUIVO';
if(ext==='pdf'){badgeBg='#fee2e2';badgeText='#b91c1c';badgeIcon='fa-file-pdf';badgeLabel='PDF';}
else if(ext==='doc'||ext==='docx'){badgeBg='#dbeafe';badgeText='#1d4ed8';badgeIcon='fa-file-word';badgeLabel='WORD';}
else if(ext==='xls'||ext==='xlsx'){badgeBg='#dcfce3';badgeText='#15803d';badgeIcon='fa-file-excel';badgeLabel='EXCEL';}
else if(ext==='mp4'||ext==='webm'){badgeBg='#f3e8ff';badgeText='#7e22ce';badgeIcon='fa-video';badgeLabel='VÍDEO';}
else if(ext==='png'||ext==='jpg'||ext==='jpeg'||ext==='webp'||ext==='svg'){badgeBg='#d1fae5';badgeText='#047857';badgeIcon='fa-image';badgeLabel=ext.toUpperCase();}

var badgeHtml = '<div class="absolute top-2 right-2 text-[9px] font-black uppercase px-2 py-1 rounded shadow-sm z-20 flex items-center gap-1 backdrop-blur-md" style="background-color:'+badgeBg+';color:'+badgeText+';"><i class="fa-solid '+badgeIcon+'"></i> '+badgeLabel+'</div>';

var isImage = /\.(jpg|jpeg|png|webp|gif|svg)$/i.test(imagePath);
var mediaHtml = '';
// Otimizações LCP/CLS: primeiras 6 imagens sem lazy, com fetchpriority high e dimensões explícitas
var isAboveFold = typeof index === 'number' && index < 6;
var imgAttrs = isAboveFold
  ? 'width="300" height="200" sizes="(max-width:640px) 50vw,(max-width:1024px) 25vw,16vw" fetchpriority="high" loading="eager"'
  : 'width="300" height="200" sizes="(max-width:640px) 50vw,(max-width:1024px) 25vw,16vw" loading="lazy" decoding="async"';
if(isImage){
mediaHtml = '<img src="'+imagePath+'" '+imgAttrs+' class="max-w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-90" alt="'+titulo+'">';
}else{
mediaHtml = '<div class="w-full h-full flex flex-col items-center justify-center transition-colors bg-gray-50 group-hover:bg-gray-100"><i class="fa-solid '+badgeIcon+' text-5xl mb-2 transition-transform duration-300 group-hover:scale-110" style="color:'+badgeText+'90;"></i><span class="text-[9px] font-black uppercase tracking-widest text-gray-400">Ver Arquivo</span></div>';
}

return '<a href="/biblioteca/'+slug+'.html" data-slug="'+slug+'" class="file-card group relative flex flex-col bg-transparent rounded-xl overflow-hidden hover:scale-[1.02] transition-transform duration-300 block"><div class="relative w-full h-[160px] md:h-[180px] bg-gray-100 flex items-center justify-center overflow-hidden rounded-xl border border-gray-200">'+badgeHtml+mediaHtml+'</div><div class="pt-2 pb-1 flex flex-col justify-start"><span class="file-card-title text-left text-xs md:text-sm font-medium text-gray-800 group-hover:text-[#1A3E74] transition-colors line-clamp-2 leading-snug">'+titulo+'</span></div></a>';
}

// Aplicar filtro + pesquisa
function applyFilterAndSearch(){
var query = searchInput ? searchInput.value.trim() : '';
var isSearching = query.length > 0;
var isCategoryFilter = currentFilter !== 'todos';

// Mostrar/ocultar botão limpar
if(searchClear) searchClear.classList.toggle('hidden', !isSearching);

if(!isSearching && !isCategoryFilter){
// Modo "Todos" sem pesquisa = mostrar grids estáticos (paginação normal)
if(dynamicGrid) dynamicGrid.classList.add('hidden');
staticGrids.forEach(function(g){if(g)g.classList.toggle('hidden', g.id!=='grid-todos');});
return;
}

// Modo pesquisa ou filtro de categoria = grid dinâmico
staticGrids.forEach(function(g){if(g)g.classList.add('hidden');});
if(dynamicGrid) dynamicGrid.classList.remove('hidden');

var results = bibliotecaGlobal.slice();

// Filtrar por categoria
if(isCategoryFilter){
results = results.filter(function(item){
return getCategoria(item) === currentFilter;
});
}

// Filtrar por pesquisa
if(isSearching){
results = results.filter(function(item){
return matchesSearch(item, query);
});
}

renderDynamicCards(results);
}

// Eventos dos botões de filtro
var filterButtons = document.querySelectorAll('.filter-btn');
filterButtons.forEach(function(btn){
btn.addEventListener('click', function(){
filterButtons.forEach(function(b){
b.classList.remove('text-[#1A3E74]','font-bold','border-[#1A3E74]','active');
b.classList.add('text-gray-500','font-medium','border-transparent');
});
btn.classList.remove('text-gray-500','font-medium','border-transparent');
btn.classList.add('text-[#1A3E74]','font-bold','border-[#1A3E74]','active');
currentFilter = btn.getAttribute('data-filter');
applyFilterAndSearch();
});
});

// Evento da barra de pesquisa
if(searchInput){
searchInput.addEventListener('input', function(){
applyFilterAndSearch();
});
}

// Botão limpar pesquisa
if(searchClear){
searchClear.addEventListener('click', function(){
searchInput.value = '';
applyFilterAndSearch();
searchInput.focus();
});
}
})();

// --- CARREGAMENTO PROGRESSIVO MOBILE ---
(function(){
var isMobile = window.innerWidth < 768;
if(!isMobile) return;

var ITEMS_PER_BATCH = 30;
var btnContainer = document.getElementById('load-more-container');
var btnLoadMore = document.getElementById('btn-load-more');
if(!btnContainer || !btnLoadMore) return;

// Aplica a todos os grids estáticos
var allGrids = document.querySelectorAll('[id^="grid-"]');
var currentVisible = ITEMS_PER_BATCH;

function applyProgressiveLoading(grid){
var cards = grid.querySelectorAll('.file-card');
if(cards.length <= ITEMS_PER_BATCH) return;

// Esconder cards além do batch inicial
for(var i = ITEMS_PER_BATCH; i < cards.length; i++){
cards[i].style.display = 'none';
cards[i].classList.add('lazy-card');
}
// Mostrar botão
btnContainer.classList.remove('hidden');
}

// Aplica no grid Todos (principal)
var gridTodos = document.getElementById('grid-todos');
if(gridTodos) applyProgressiveLoading(gridTodos);

// Também nos outros grids quando ficarem visíveis
btnLoadMore.addEventListener('click', function(){
var anyRevealed = false;
allGrids.forEach(function(grid){
if(grid.classList.contains('hidden')) return;
var hiddenCards = grid.querySelectorAll('.lazy-card');
var toReveal = Math.min(ITEMS_PER_BATCH, hiddenCards.length);
for(var i = 0; i < toReveal; i++){
hiddenCards[i].style.display = '';
hiddenCards[i].classList.remove('lazy-card');
anyRevealed = true;
}
// Verificar se ainda há cartões escondidos neste grid
var stillHidden = grid.querySelectorAll('.lazy-card').length;
if(stillHidden === 0 && !grid.classList.contains('hidden')){
// Todos revelados neste grid
}
});

// Esconder botão se todos os grids visíveis não tiverem mais cartões
var allRevealed = true;
allGrids.forEach(function(grid){
if(grid.classList.contains('hidden')) return;
if(grid.querySelectorAll('.lazy-card').length > 0) allRevealed = false;
});
if(allRevealed){
btnContainer.classList.add('hidden');
}
});

// Re-aplicar quando filtros mudam (observar mudanças nos grids)
var observer = new MutationObserver(function(){
setTimeout(function(){
var visibleGrid = document.querySelector('[id^="grid-"]:not(.hidden)');
if(visibleGrid && visibleGrid.querySelectorAll('.lazy-card').length === 0){
// Re-aplicar se o grid foi recém-preenchido (filtro global)
var cards = visibleGrid.querySelectorAll('.file-card');
if(cards.length > ITEMS_PER_BATCH){
for(var i = ITEMS_PER_BATCH; i < cards.length; i++){
if(cards[i].style.display !== 'none'){
cards[i].style.display = 'none';
cards[i].classList.add('lazy-card');
}
}
btnContainer.classList.remove('hidden');
currentVisible = ITEMS_PER_BATCH;
}
}
}, 200);
});

allGrids.forEach(function(grid){
observer.observe(grid, {childList: true, subtree: false});
});
})();

// Lightbox Lógica
let currentGlobalIndex = -1;

function slugifyJs(text) {
return String(text || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "")
.replace(/[^a-z0-9]+/g, "-")
.replace(/(^-|-$)/g, "");
}

function updateLightboxUI() {
if (currentGlobalIndex === -1 || bibliotecaGlobal.length === 0) return;
const item = bibliotecaGlobal[currentGlobalIndex];
let imagePath = item.capa || item.ficheiro || "";
if (imagePath && !imagePath.startsWith("/")) imagePath = "/" + imagePath;
const title = item.titulo || "Arquivo sem título";
const slug = item.slug || slugifyJs(title);
const pageUrl = `/biblioteca/${slug}.html`;
const desc = item.descricao && item.descricao.trim() !== "" ? item.descricao : `Download do material sobre ${title} na nossa Biblioteca.`;
const categoria = String(item.categoria || item.tipo || "")
.toLowerCase()
.trim();
const isVideo = categoria === "videos" || categoria === "vídeos" || imagePath.match(/\.(mp4|webm|mov)$/i);

const img = document.getElementById("lightbox-img");
const video = document.getElementById("lightbox-video");
const playBtn = document.getElementById("lightbox-play-btn");

img.src = imagePath;
img.classList.remove("hidden");
video.pause();
video.src = "";
video.classList.add("hidden");
if (isVideo) playBtn.classList.remove("hidden");
else playBtn.classList.add("hidden");

document.getElementById("lightbox-title").textContent = title;
document.getElementById("lightbox-download").href = imagePath;
document.getElementById("lightbox-page-link").href = pageUrl;
document.getElementById("lightbox-desc").textContent = desc;

document.getElementById("lightbox-prev").classList.toggle("hidden", currentGlobalIndex <= 0);
document.getElementById("lightbox-next").classList.toggle("hidden", currentGlobalIndex >= bibliotecaGlobal.length - 1);
}

document.getElementById("lightbox-play-btn").addEventListener("click", () => {
if (currentGlobalIndex === -1 || bibliotecaGlobal.length === 0) return;
let videoPath = bibliotecaGlobal[currentGlobalIndex].ficheiro || "";
if (videoPath && !videoPath.startsWith("/")) videoPath = "/" + videoPath;
document.getElementById("lightbox-img").classList.add("hidden");
document.getElementById("lightbox-play-btn").classList.add("hidden");
const video = document.getElementById("lightbox-video");
video.src = videoPath;
video.classList.remove("hidden");
video.play();
});

document.body.addEventListener("click", (e) => {
const card = e.target.closest(".file-card");
if (!card || bibliotecaGlobal.length === 0) return;
e.preventDefault();
const slugFromCard = card.dataset.slug || card.getAttribute("href").split("/").pop().replace(".html", "");
if (!slugFromCard) return;
const foundIndex = bibliotecaGlobal.findIndex((item) => (item.slug || slugifyJs(item.titulo)) === slugFromCard);
if (foundIndex === -1) return;

currentGlobalIndex = foundIndex;
updateLightboxUI();
const lightbox = document.getElementById("global-lightbox");
lightbox.classList.remove("hidden");
document.body.style.overflow = "hidden";
setTimeout(() => {
lightbox.classList.remove("opacity-0");
lightbox.classList.add("opacity-100");
}, 10);
});

document.getElementById("lightbox-prev").addEventListener("click", (e) => {
e.stopPropagation();
if (currentGlobalIndex > 0) {
currentGlobalIndex--;
updateLightboxUI();
}
});
document.getElementById("lightbox-next").addEventListener("click", (e) => {
e.stopPropagation();
if (currentGlobalIndex < bibliotecaGlobal.length - 1) {
currentGlobalIndex++;
updateLightboxUI();
}
});

function fecharLightbox() {
const lightbox = document.getElementById("global-lightbox");
document.getElementById("lightbox-video").pause();
lightbox.classList.remove("opacity-100");
lightbox.classList.add("opacity-0");
setTimeout(() => {
lightbox.classList.add("hidden");
document.body.style.overflow = "";
document.getElementById("lightbox-img").src = "";
}, 300);
}

document.addEventListener("keydown", (e) => {
if (!document.getElementById("global-lightbox").classList.contains("hidden")) {
if (e.key === "Escape") fecharLightbox();
else if (e.key === "ArrowLeft" && currentGlobalIndex > 0) {
currentGlobalIndex--;
updateLightboxUI();
} else if (e.key === "ArrowRight" && currentGlobalIndex < bibliotecaGlobal.length - 1) {
currentGlobalIndex++;
updateLightboxUI();
}
}
});
</script>
