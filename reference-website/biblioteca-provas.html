<script>
document.addEventListener("DOMContentLoaded",function(){
'use strict';

// --- MINI CARDS: SIMULADOS ---
var simuladosData=[
{url:"simulado-de-enfermagem.html",titulo:"1º Simulado Técnico",cargo:"Técnico em Enfermagem",questoes:"50 questões"},
{url:"simulado-de-enfermagem4.html",titulo:"2º Simulado Técnico",cargo:"Técnico em Enfermagem",questoes:"50 questões"},
{url:"simulado-de-enfermagem2.html",titulo:"1º Simulado Enfermeiro",cargo:"Enfermeiro",questoes:"50 questões"},
{url:"simulado-de-enfermagem3.html",titulo:"2º Simulado Enfermeiro",cargo:"Enfermeiro",questoes:"50 questões"},
{url:"simulado-de-enfermagem-nucleo-de-seguranca-do-paciente.html",titulo:"Segurança do Paciente",cargo:"Enfermagem",questoes:"50 questões"},
{url:"simulado-de-enfermagem-doencas-de-notificacao-compulsoria.html",titulo:"Notificação Compulsória",cargo:"Enfermagem",questoes:"50 questões"},
{url:"simulado_vacinacao.html",titulo:"Vacinação",cargo:"Enfermagem",questoes:"10/20/30 questões"},
{url:"simulado_pcr.html",titulo:"PCR",cargo:"Enfermagem",questoes:"10/20/30 questões"},
{url:"simulado_bloco-operatorio.html",titulo:"Bloco Operatório",cargo:"Enfermagem",questoes:"10/20/30 questões"},
{url:"simulado_ibam_bebedouro_enfermeiro_2024.html",titulo:"IBAM Bebedouro 2024",cargo:"Enfermeiro",questoes:"14 questões"},
{url:"simulado_ibam_guarulhos_enfermeiro_2024.html",titulo:"IBAM Guarulhos 2024",cargo:"Enfermeiro",questoes:"32 questões"}
];

var miniContainer=document.getElementById('mini-simulados');
simuladosData.forEach(function(s){
miniContainer.innerHTML+='<a href="'+s.url+'" class="mini-card"><h4>'+s.titulo+'</h4><p>'+s.cargo+' &middot; '+s.questoes+'</p></a>';
});

// --- PROVAS ---
var container=document.getElementById('provas-container');

fetch("./biblioteca-provas.json")
.then(function(r){return r.json()})
.then(function(data){
var provas=data.provas;
if(!provas||provas.length===0){
container.innerHTML='<div class="text-center py-12 bg-white rounded-2xl shadow"><p class="text-gray-500">Nenhuma prova encontrada.</p><p class="text-sm text-gray-400 mt-2">Execute node build-pdf_provas_de_concursos.js</p></div>';
return;
}

var html='';
provas.forEach(function(p,i){
var pdfPath=p.pdf_url;
if(pdfPath.startsWith("/")) pdfPath="."+pdfPath;

// Tentar extrair info adicional do nome do arquivo
var nomeArquivo=p.nomeArquivo||'';
var isGabarito=nomeArquivo.toLowerCase().indexOf('gabarito')>=0;
if(isGabarito) return; // Pula gabaritos, mostra só provas

// Buscar gabarito correspondente
var gabaritoPath='';
provas.forEach(function(g){
if(g.nomeArquivo&&g.nomeArquivo!==nomeArquivo&&g.nomeArquivo.toLowerCase().indexOf('gabarito')>=0){
var baseProva=nomeArquivo.replace(/-prova/i,'').replace(/\.pdf$/i,'');
var baseGab=g.nomeArquivo.replace(/-gabarito/i,'').replace(/\.pdf$/i,'');
if(baseProva===baseGab||baseGab.indexOf(baseProva)>=0||baseProva.indexOf(baseGab)>=0){
gabaritoPath=g.pdf_url;
if(gabaritoPath.startsWith("/")) gabaritoPath="."+gabaritoPath;
}
}
});

var delay=(i*0.08)+'s';
html+='<div class="prova-card bg-white rounded-2xl shadow-[0_8px_28px_rgba(0,0,0,.08)] overflow-hidden border border-gray-100" style="animation-delay:'+delay+'">';
html+='<div class="flex flex-col lg:flex-row">';

// PDF
html+='<div class="lg:w-1/2 p-3 bg-gray-50"><iframe src="'+pdfPath+'" class="pdf-viewer w-full rounded-xl shadow-inner" title="'+p.titulo+'" loading="lazy"></iframe></div>';

// Info
html+='<div class="lg:w-1/2 p-5 flex flex-col justify-between">';
html+='<div>';
html+='<div class="flex flex-wrap gap-1 mb-3">';
if(p.banca&&p.banca!=='Não identificada') html+='<span class="tag tag-banca">'+p.banca+'</span>';
if(p.ano) html+='<span class="tag tag-ano">'+p.ano+'</span>';
html+='<span class="tag tag-nivel">'+p.nivel+'</span>';
html+='</div>';

html+='<h3 class="text-lg font-black text-gray-800 mb-3 leading-tight">'+p.titulo+'</h3>';

html+='<div class="info-grid mb-3">';
if(p.cargo) html+='<div><span class="info-label">Cargo</span><br><span class="info-val">'+p.cargo+'</span></div>';
if(p.banca&&p.banca!=='Não identificada') html+='<div><span class="info-label">Banca</span><br><span class="info-val">'+p.banca+'</span></div>';
if(p.instituicao&&p.instituicao.length>3) html+='<div><span class="info-label">Instituição</span><br><span class="info-val">'+p.instituicao+'</span></div>';
if(p.ano) html+='<div><span class="info-label">Ano</span><br><span class="info-val">'+p.ano+'</span></div>';
if(p.estado) html+='<div><span class="info-label">Estado</span><br><span class="info-val">'+p.estado+'</span></div>';
if(p.questoes) html+='<div><span class="info-label">Questões</span><br><span class="info-val">'+p.questoes+'</span></div>';
html+='</div>';

html+='<p class="text-xs text-gray-500 leading-relaxed">'+p.descricao+'</p>';
html+='</div>';

html+='<div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-gray-100 mt-3">';
html+='<a href="'+pdfPath+'" class="btn-download flex-1 text-center" download><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" width="14" height="14"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 242.7-73.4-73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L288 274.7 288 32zM64 352c-35.3 0-64 28.7-64 64l0 32c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-32c0-35.3-28.7-64-64-64l-101.5 0-45.3 45.3c-25 25-65.5 25-90.5 0L165.5 352 64 352zm368 56a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"/></svg>Baixar Prova</a>';
if(gabaritoPath){
html+='<a href="'+gabaritoPath+'" class="btn-gabarito flex-1 text-center" target="_blank" rel="noopener"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" width="14" height="14"><path d="M342.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 178.7l-57.4-57.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l80 80c12.5 12.5 32.8 12.5 45.3 0l160-160zm96 128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 402.7 54.6 297.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0l256-256z"/></svg>Gabarito</a>';
}
html+='</div>';
html+='</div></div></div>';
});

container.innerHTML=html;
})
.catch(function(e){
console.error(e);
container.innerHTML='<div class="text-center py-12 bg-white rounded-2xl shadow"><p class="text-gray-500">Erro ao carregar.</p></div>';
});
});
</script>
