<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOME DA ESCALA | Calculadoras de Enfermagem</title>
<meta name="description" content="DESCRIÇÃO"/>
<link href="/public/output.css" rel="stylesheet">
<link href="/global-styles.css" rel="stylesheet">
<link href="/css/pages/cart-emergencia.css" rel="stylesheet">
<link href="/css/pages/cko-page-shell.css" rel="stylesheet">
<link href="/css/pages/cko-page-templates.css" rel="stylesheet">
<script src="/global-scripts.js" defer></script>
<script src="/lang-selector.js" defer></script>
<script src="/js/cko-page-shell.js" defer></script>
<script src="/js/cko-page-templates.js" defer></script>
<script src="/js/cko-ratings-hold.js" defer></script>
</head>
<body class="cko-cart-page" data-cko-template="scale" data-cko-theme="clinical">
<a class="cko-ds-skip" href="#main-content">Ir para o conteúdo</a>
<div id="global-header-container"></div>
<div id="language-selector-placeholder"></div>
<main id="main-content" class="flex-grow p-4 sm:p-8 max-w-7xl mx-auto w-full">
  <!-- POL-CKO-MD-REG-FRONTEND: chrome.breadcrumb=one, chrome.hero=one.
       Do not add nav.crumbs / section.hero here. -->
  <div data-cko-page="PAGE_ID" data-cko-slot="chrome"></div>
  <div data-cko-page="PAGE_ID" data-cko-slot="hero"></div>
  <div class="cko-layout">
    <div class="cko-layout__main">
      <div class="cko-calc-workspace">
        <section class="cko-calc-panel" data-cko-scale-items>
          <h2 class="cko-calc-panel__title">Itens da escala</h2>
          <form id="scaleForm"><!-- critérios --></form>
          <div class="cko-calc-actions">
            <button type="button" class="cko-btn cko-btn--primary">Calcular escore</button>
            <button type="button" class="cko-btn cko-btn--ghost">Limpar</button>
          </div>
        </section>
        <section class="cko-calc-result" data-cko-scale-score hidden>
          <p>Escore e interpretação — HOLD, sem promoção clínica.</p>
        </section>
      </div>
    </div>
    <aside class="cko-layout__side" data-cko-page="PAGE_ID" data-cko-slot="sidebar" aria-label="Referências da escala"></aside>
  </div>
</main>
<div id="footer-placeholder"></div>
</body>
</html>
